<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angle Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Same notebook world as Number Lab; angle arcs carry the colour. */

  --accent: #1f4e8c; --good: #1f7a46; --bad: #c0392b;

  --display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;

}
* { box-sizing: border-box; }
html, body { margin: 0; }

.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

.sub { color: var(--muted); font-size: 15px; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.grades, .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; }

.pill { border: 2px solid var(--ink); background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 700; }

.panel { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 20px; box-shadow: 6px 6px 0 var(--grid); display: grid; gap: 14px; }
.panel h2 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0; }
.howto { color: var(--muted); margin: 0; max-width: 68ch; }
.prompt { font-size: 20px; margin: 0; }
.prompt b { font-family: var(--display); }
.stage { display: grid; justify-items: center; }
svg.fig { width: 100%; max-width: 520px; height: auto; display: block; touch-action: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 2px solid var(--ink); background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 16px; font-weight: 700; }
.btn.ghost { background: #fff; color: var(--ink); }
.score { margin-left: auto; font-weight: 700; color: var(--muted); }
.score b { color: var(--ink); font-family: var(--display); font-size: 20px; }
.feedback { min-height: 28px; font-size: 18px; border-left: 5px solid transparent; padding: 6px 12px; border-radius: 4px; }
.feedback.good { border-color: var(--good); background: #e8f4ec; }
.feedback.bad { border-color: var(--bad); background: #fbeceb; }
.feedback.info { border-color: var(--accent); background: #eaf0f8; }

.choice { border: 2px solid var(--ink); background: #fff; border-radius: 12px; padding: 10px 18px; font-family: var(--display); font-weight: 800; font-size: 22px; min-width: 110px; }
.choice.right { background: #e3f3e8; border-color: var(--good); }
.choice.wrong { background: #fbe3e1; border-color: var(--bad); }

.toggle { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; }

</style>
</head>
<body>
<header>
  <div class="brand">
    <h1><svg width="40" height="34" viewBox="0 0 40 34" aria-hidden="true"><path d="M4 30 H38" stroke="#1d2a33" stroke-width="4" stroke-linecap="round"/><path d="M4 30 L30 4" stroke="#1d2a33" stroke-width="4" stroke-linecap="round"/><path d="M18 30 A14 14 0 0 0 14 20" fill="none" stroke="#d9482b" stroke-width="4"/></svg>Angle Lab</h1>
    <span class="sub">Angles · Math carousel station</span>
  </div>
  <div class="bar">
    <div class="grades" role="group" aria-label="Grade">
      <button class="pill" data-grade="4" id="g4">Grade 4</button>
      <button class="pill" data-grade="5" id="g5">Grade 5</button>
      <button class="pill" data-grade="6" id="g6">Grade 6</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Games">
      <button class="tab" role="tab" data-game="name" id="t-name">Name it</button>
      <button class="tab" role="tab" data-game="estimate" id="t-estimate">Estimate it</button>
      <button class="tab" role="tab" data-game="measure" id="t-measure">Read the protractor</button>
      <button class="tab" role="tab" data-game="build" id="t-build">Build it</button>
      <button class="tab" role="tab" data-game="missing" id="t-missing">Missing angle</button>
    </div>
  </div>
</header>
<main id="main"></main>
<footer>Tip for teachers: each game and grade has its own link, like #g5-measure. Pick a grade and game, then copy the address.</footer>

  root.append(el("h2", { text: "Build it" }),
    el("p", { class: "howto", text: "Drag the red arm (or click the picture and use the arrow keys) to make the angle, then press Check." }),
    el("p", { class: "prompt" }, G === 4 ? ["Make " + (kind === "acute" ? "an " : "a "), el("b", { text: kind }), " angle."] : ["Make an angle of ", el("b", { text: target + "°" }), "."]),
    el("div", { class: "stage" }, [svg]),
    el("div", { class: "row" }, [el("button", { class: "btn", text: "Check", onclick: check }), toggle, el("button", { class: "btn ghost", text: "New angle", onclick: render }), scoreEl("build")]), box);
}

// ---------- 5. Missing angle ----------
function gameMissing(root) {

  var cx = 250, cy = 170, L = 150, rot = G === 4 ? 0 : rnd(0, 7) * 15;
  var svg = svgBox(500, 340), g = s("g", {}); svg.appendChild(g);
  var ans, text, why;
  var st = G === 4 ? 10 : 5;

    var a = rnd(2, 90 / st - 2) * st; ans = 90 - a;
    ray(g, cx, cy, rot, L); ray(g, cx, cy, rot + a, L); ray(g, cx, cy, rot + 90, L);
    rightMark(g, cx, cy, rot, 18, C.muted); arc(g, cx, cy, 52, rot, rot + a, C.arc2); arc(g, cx, cy, 70, rot + a, rot + 90, C.arc);
    label(g, cx, cy, 96, rot + a / 2, a + "°", C.arc2); label(g, cx, cy, 108, rot + a + ans / 2, "?", C.arc);
    text = "The two angles make a right angle."; why = "A right angle is 90°, so ? = 90° − " + a + "° = " + ans + "°.";
  } else if (kind === "straight") {

    ray(g, cx, cy, rot, L); ray(g, cx, cy, rot + 180, L); ray(g, cx, cy, rot + a2, L);
    arc(g, cx, cy, 46, rot, rot + a2, C.arc2); arc(g, cx, cy, 62, rot + a2, rot + 180, C.arc);
    label(g, cx, cy, 90, rot + a2 / 2, a2 + "°", C.arc2); label(g, cx, cy, 96, rot + a2 + ans / 2, "?", C.arc);
    text = "The angles are on a straight line."; why = "A straight angle is 180°, so ? = 180° − " + a2 + "° = " + ans + "°.";
  } else if (kind === "straight3") {
    var p = rnd(4, 14) * 5, q = rnd(4, 14) * 5; ans = 180 - p - q;
    var order = shuffle([["k1", p], ["k2", q], ["u", ans]]), start = rot;
    ray(g, cx, cy, rot, L); ray(g, cx, cy, rot + 180, L);
    order.forEach(function (o, i) {
      var col = o[0] === "u" ? C.arc : i % 2 ? C.arc3 : C.arc2;
      if (i > 0) ray(g, cx, cy, start, L);
      arc(g, cx, cy, 44 + i * 10, start, start + o[1], col); label(g, cx, cy, 96 + (i % 2) * 14, start + o[1] / 2, o[0] === "u" ? "?" : o[1] + "°", col);
      start += o[1];
    });
    text = "The three angles are on a straight line."; why = "They add to 180°, so ? = 180° − " + p + "° − " + q + "° = " + ans + "°.";
  } else if (kind === "point") {
    var x1 = rnd(12, 28) * 5, x2 = rnd(12, 28) * 5; ans = 360 - x1 - x2;
    var parts = shuffle([["k", x1], ["k", x2], ["u", ans]]), at = rot;
    parts.forEach(function (o, i) {
      ray(g, cx, cy, at, L); var col = o[0] === "u" ? C.arc : i % 2 ? C.arc3 : C.arc2;
      arc(g, cx, cy, 40 + i * 9, at, at + o[1], col); label(g, cx, cy, 92, at + o[1] / 2, o[0] === "u" ? "?" : o[1] + "°", col);
      at += o[1];
    });
    text = "The angles are around a point."; why = "Angles around a point add to 360°, so ? = 360° − " + x1 + "° − " + x2 + "° = " + ans + "°.";
  } else {
    var th = rnd(6, 30) * 5; if (th === 90) th = 70;
    ray(g, cx, cy, rot, L); ray(g, cx, cy, rot + 180, L); ray(g, cx, cy, rot + th, L); ray(g, cx, cy, rot + th + 180, L);
    arc(g, cx, cy, 44, rot, rot + th, C.arc2); label(g, cx, cy, 86, rot + th / 2, th + "°", C.arc2);
    if (kind === "opposite") { ans = th; arc(g, cx, cy, 44, rot + 180, rot + 180 + th, C.arc); label(g, cx, cy, 86, rot + 180 + th / 2, "?", C.arc); text = "Two straight lines cross."; why = "Opposite angles are equal, so ? = " + th + "°."; }
    else { ans = 180 - th; arc(g, cx, cy, 52, rot + th, rot + 180, C.arc); label(g, cx, cy, 92, rot + th + ans / 2, "?", C.arc); text = "Two straight lines cross."; why = "Angles next to each other on a straight line add to 180°, so ? = 180° − " + th + "° = " + ans + "°."; }
  }
  dot(g, cx, cy);
  svg.setAttribute("aria-label", text + " Find the angle marked with a question mark.");
  var box = el("div", { class: "feedback", "aria-live": "polite" }), done = false, a = answerBox(check);
  function check() {
    if (done) return; if (a.input.value === "") { fb(box, "info", "Type the missing angle in degrees."); return; }
    done = true; var ok = +a.input.value === ans; if (ok) bump("missing");
    fb(box, ok ? "good" : "bad", (ok ? "Correct! " : "Not quite. ") + why);
  }
  root.append(el("h2", { text: "Missing angle" }),
    el("p", { class: "howto", text: "Don't measure: work it out with what you know. a right angle is 90°, a straight angle is 180°" + (G === 6 ? ", angles around a point add to 360° and opposite angles are equal." : ".") }),
    el("p", { class: "prompt" }, [text + " Find the angle marked ", el("b", { text: "?" }), "."]), el("div", { class: "stage" }, [svg]),
    el("div", { class: "row" }, [a.node, el("button", { class: "btn", text: "Check", onclick: check }), el("button", { class: "btn ghost", text: "Next", onclick: render }), scoreEl("missing")]), box);
}

// ---------- shell ----------
var DRAW = { name: gameName, estimate: gameEstimate, measure: gameMeasure, build: gameBuild, missing: gameMissing };
var main = document.getElementById("main");
function render() {

  document.querySelectorAll("[data-game]").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.game === state.game)); });
  main.innerHTML = "";
  var panel = el("section", { class: "panel", role: "tabpanel", "aria-labelledby": "t-" + state.game });
  main.appendChild(panel); DRAW[state.game](panel);
  var h = "g" + state.grade + "-" + state.game;
  if (location.hash.slice(1) !== h) { try { history.replaceState(null, "", "#" + h); } catch (e) { location.hash = h; } }
}
function fromHash() { var m = /^#g([456])-([a-z]+)$/.exec(location.hash); if (m && GAMES.indexOf(m[2]) !== -1) { state.grade = +m[1]; state.game = m[2]; return true; } return false; }
document.querySelectorAll("[data-grade]").forEach(function (b) { b.addEventListener("click", function () { state.grade = +b.dataset.grade; render(); }); });

window.addEventListener("hashchange", function () { if (fromHash()) render(); });
fromHash(); render();
window.__angle = { typeOf: typeOf };
})();
